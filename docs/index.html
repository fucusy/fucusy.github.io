<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bytedance.ai – Apps by Qiang Chen</title>
  <meta name="description" content="Independent apps by Qiang Chen: Diary Companion (handwriting journal with AI) and Gomoku (classic board game).">
  <link rel="icon" type="image/png" href="./favicon.png">
  <style>
    :root {
      --ink: #1f2a24;
      --muted: #5a625e;
      --accent: #4a7a5a;
      --bg: #f9f0e2;
      --card: #fdfbf7;
      --line: #d9d0c2;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    h1 {
      font-size: 1.8rem;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .tagline {
      color: var(--muted);
      margin-bottom: 40px;
    }
    .apps {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      justify-content: center;
    }
    .app-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 28px;
      width: 280px;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .app-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(74,122,90,0.15);
    }
    .app-card img {
      width: 56px;
      height: 56px;
      border-radius: 12px;
      margin-bottom: 16px;
    }
    .app-card h2 {
      font-size: 1.2rem;
      color: var(--accent);
      margin-bottom: 8px;
    }
    .app-card p {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
    }
    footer {
      margin-top: 60px;
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
    }
    footer a {
      color: var(--accent);
      text-decoration: none;
    }
    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>bytedance.ai</h1>
  <p class="tagline">Independent apps by Qiang Chen</p>

  <div class="apps">
    <a href="./diary.html" class="app-card">
      <img src="./diary-favicon.png" alt="Diary Companion icon" width="56" height="56">
      <h2>Diary Companion</h2>
      <p>A private handwriting journal app with on-device AI reflection.</p>
    </a>

    <a href="./gomoku.html" class="app-card">
      <img src="./favicon.png" alt="Gomoku icon" width="56" height="56">
      <h2>Gomoku</h2>
      <p>Classic five-in-a-row board game. Play against AI or a friend.</p>
    </a>
  </div>

  <footer>
    <p>Contact: <a href="mailto:qiang@hula.ai">qiang@hula.ai</a></p>
  </footer>
</body>
</html>

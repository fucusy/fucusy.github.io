<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyNextDish — shared list</title>
<style>
  body{font:16px -apple-system,system-ui,sans-serif;margin:0;background:#f6f6f8;color:#111}
  main{max-width:560px;margin:0 auto;padding:24px 16px 48px}
  h1{font-size:24px;margin:0 0 4px}
  .sub{color:#666;margin:0 0 20px}
  .btns{display:flex;flex-direction:column;gap:10px;margin:0 0 24px}
  a.btn,button{display:block;text-align:center;padding:14px;border-radius:12px;border:0;font:600 16px inherit;text-decoration:none;cursor:pointer}
  .primary{background:#0a84ff;color:#fff}.secondary{background:#e5e5ea;color:#111}
  ol{list-style:none;padding:0;margin:0}
  li{background:#fff;border-radius:12px;padding:12px 14px;margin:0 0 8px}
  li b{display:block}li span{color:#666;font-size:14px;display:block}
  .note{color:#666;font-size:14px;margin-top:20px}
</style>
</head>
<body>
<main>
  <h1 id="title">MyNextDish</h1>
  <p class="sub" id="sub">Save restaurants, tag them, and find your next dish.</p>
  <div class="btns">
    <a class="btn primary" id="open" href="#" hidden>Open in MyNextDish</a>
    <a class="btn secondary" id="get" href="https://testflight.apple.com/join/REPLACE_ME">Get the app</a>
    <button class="secondary" id="copy" hidden>Copy list link</button>
  </div>
  <ol id="places"></ol>
  <p class="note" id="note" hidden>After installing the app, come back to this page (or the message you received) and tap “Open in MyNextDish”. The list is stored in this link only; nothing is uploaded.</p>
</main>
<script>
(async () => {
  const payload = location.hash.slice(1);
  if (!payload) return;
  try {
    let b64 = payload.replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    const wire = JSON.parse(await new Response(stream).text());
    if (wire.v !== 1 || !Array.isArray(wire.p)) throw new Error('bad');
    const title = String(wire.t || 'Shared list');
    document.title = title + ' — MyNextDish';
    document.getElementById('title').textContent = title;
    document.getElementById('sub').textContent = wire.p.length + (wire.p.length === 1 ? ' place' : ' places') + ' shared with you on MyNextDish.';
    const list = document.getElementById('places');
    for (const p of wire.p) {
      const li = document.createElement('li');
      const name = document.createElement('b'); name.textContent = String(p.n);
      li.appendChild(name);
      for (const text of [p.a, p.c]) {
        if (!text) continue;
        const s = document.createElement('span'); s.textContent = String(text); li.appendChild(s);
      }
      list.appendChild(li);
    }
    const open = document.getElementById('open');
    open.href = 'mynextdish://list?d=' + payload;
    open.hidden = false;
    const copy = document.getElementById('copy');
    copy.hidden = false;
    copy.onclick = async () => { await navigator.clipboard.writeText(location.href); copy.textContent = 'Copied'; };
    document.getElementById('note').hidden = false;
  } catch (e) {
    document.getElementById('sub').textContent = 'This list link looks damaged. Ask for it to be shared again.';
  }
})();
</script>
</body>
</html>
